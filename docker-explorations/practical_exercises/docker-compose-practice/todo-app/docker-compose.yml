version: '3.8'

services:
  todo-app:
    build: .
    container_name: todo
    volumes:
      - todo-data:/app/data
    restart: unless-stopped
    ports:
      - 3000:3000
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - todo-network
      - postgres-network
  
  postgres-db:
    image: postgres:15
    container_name: db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=farooq
      - POSTGRES_PASSWORD=farooq123
      - POSTGRES_DB=todo    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - postgres-network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farooq -d todo"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  todo-network:
    driver: bridge
  postgres-network:
    driver: bridge

volumes:
  todo-data:
  postgres-data: